# Managed by go-conventions (references/release.md owns the release contract;
# the workflow hygiene this complies with is github-conventions' references/workflows.md).
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# Serialized on a constant group and never cancelled mid-run: two tags pushed
# together would otherwise race to publish the same artifacts.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Forks must not publish under the upstream name.
    if: github.repository == 'jhoblitt/gnome-monitor-pin'
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true

      # The binary carries no -X ldflags: go build stamps the module version
      # from the tag. Prove the checkout produces that stamp before releasing.
      - name: Assert the tag is the version the binary reports
        env:
          TAG: ${{ github.ref_name }}
        run: |
          go build -o "$RUNNER_TEMP/gnome-monitor-pin" ./cmd/gnome-monitor-pin
          stamped=$(go version -m "$RUNNER_TEMP/gnome-monitor-pin" | awk '$1 == "mod" { print $3 }')
          [ "$stamped" = "$TAG" ] || { echo "binary stamped '$stamped', want '$TAG'"; exit 1; }

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: goreleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  rpm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: goreleaser
    # Forks must not publish under the upstream name.
    if: github.repository == 'jhoblitt/gnome-monitor-pin'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        fedora: ["43", "44"]
    container:
      image: registry.fedoraproject.org/fedora:${{ matrix.fedora }}
    steps:
      - name: Install packaging tools
        run: dnf -y install rpm-build systemd-rpm-macros git-core gh tar

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # goreleaser already built and stamped the binary; the RPM ships
      # exactly the bytes the archive does.
      - name: Download the release archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release download "$TAG" --pattern '*_linux_amd64.tar.gz' --output archive.tar.gz

      - name: Build the RPM
        env:
          TAG: ${{ github.ref_name }}
        run: packaging/build-rpm.sh "$TAG" archive.tar.gz out

      - name: Hand the RPM to the check job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rpm-fc${{ matrix.fedora }}
          path: out/*.rpm
          retention-days: 1
          if-no-files-found: error

  rpm-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: rpm
    # Forks must not publish under the upstream name.
    if: github.repository == 'jhoblitt/gnome-monitor-pin'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        fedora: ["43", "44"]
    # A container the build never touched: the RPM has to pull its own
    # dependencies, not inherit rpm-build's, gh's, and tar's closures.
    container:
      image: registry.fedoraproject.org/fedora:${{ matrix.fedora }}
    steps:
      - name: Download the RPM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rpm-fc${{ matrix.fedora }}
          path: out

      - name: Install the RPM and check the version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          dnf -y install ./out/*.rpm
          reported=$(gnome-monitor-pin --version)
          case "$reported" in
            *"$TAG"*) echo "reports $reported" ;;
            *) echo "binary reports '$reported', want '$TAG'"; exit 1 ;;
          esac
          test -f /usr/lib/systemd/user/gnome-monitor-pin.service

      - name: Upload the RPM to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          dnf -y install gh
          gh release upload "$TAG" out/*.rpm --clobber
