# Managed by go-conventions (references/release.md owns the release contract).
version: 2

builds:
  - id: gnome-monitor-pin
    main: ./cmd/gnome-monitor-pin
    binary: gnome-monitor-pin
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    # No -X: the version comes from debug.ReadBuildInfo, stamped by go build
    # from the git tag. goreleaser's default ldflags would add harmless -X
    # values for symbols that do not exist; they are replaced, not extended.
    ldflags:
      - -s -w
    # A session-bus client for mutter has no other platform to run on.
    goos:
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - formats:
      - tar.gz

checksum:
  name_template: checksums.txt

# ko rebuilds the binary from this checkout with the same build options, so
# the image's binary carries the same VCS stamp as the archives.
kos:
  - id: gnome-monitor-pin
    build: gnome-monitor-pin
    repositories:
      - ghcr.io/jhoblitt/gnome-monitor-pin
    bare: true
    base_image: gcr.io/distroless/static:nonroot
    platforms:
      - linux/amd64
      - linux/arm64
    tags:
      - "{{ .Version }}"
      - latest
    sbom: spdx

sboms:
  - artifacts: archive

signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum

docker_signs:
  - cmd: cosign
    args:
      - sign
      - "${artifact}"
      - "--yes"
    artifacts: manifests

changelog:
  use: github
