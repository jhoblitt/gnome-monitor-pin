extends:
  - "@commitlint/config-conventional"

rules:
  # Dependabot bodies carry compare URLs longer than 100 chars, and the
  # commitlint bundled in the wagoid action (19.x) has no URL exemption;
  # rook/rook disables this rule for the same reason.
  body-max-line-length: [0, always]
  # Dependabot decides between "bump" and "Bump" from the repository's recent
  # commit messages, matching `: <Uppercase>` anywhere in the full message,
  # trailers included. Every commit here carries a Co-Authored-By trailer, so
  # its first PR came out as "build(deps): Bump ..." and later ones copy that
  # style. config-conventional forbids sentence-case; allow it and keep the
  # bans on Start Case, PascalCase, and UPPER CASE.
  subject-case: [2, never, [start-case, pascal-case, upper-case]]
